{% extends "base.html" %}
{% block title %}Sign in — Festival Planner{% endblock %}
{% block content %}
<section class="card card--narrow">
  <h1 class="brand">Festival Planner</h1>

  {% if error %}
  <p class="alert alert--error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="stack">
    <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token }}">

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <label for="totp">Two-factor code <span class="hint">(only if enabled)</span></label>
    <input id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]*" maxlength="6">

    <button type="submit" class="btn btn--primary">Sign in</button>
  </form>

  <p class="hint">
    Accounts are created by invitation only. Ask a festival admin for an invite link.
  </p>
</section>
{% endblock %}
