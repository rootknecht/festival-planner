{% extends "base.html" %}
{% block title %}Festival Planner{% endblock %}
{% block content %}
<section class="card">
  <h1 class="brand">Festival Planner</h1>
  <p>Signed in as {{ user.display_name }}.</p>
  <form method="post" action="/logout">
    <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token }}">
    <button type="submit" class="btn">Sign out</button>
  </form>
</section>
{% endblock %}
