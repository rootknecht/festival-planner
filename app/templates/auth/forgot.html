{% extends "base.html" %}
{% block title %}Reset password — Festival Planner{% endblock %}
{% block content %}
<section class="card card--narrow">
  <h1 class="brand">Reset password</h1>
  {% if notice %}
  <p class="alert" role="status">{{ notice }}</p>
  {% else %}
  <form method="post" action="/forgot" class="stack">
    <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token }}">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <button type="submit" class="btn btn--primary">Send reset link</button>
  </form>
  {% endif %}
  <p class="hint"><a href="/login">Back to sign in</a></p>
</section>
{% endblock %}
