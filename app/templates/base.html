<!DOCTYPE html>
<html lang="{{ language }}" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Festival Planner{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/themes/{{ theme }}.css">
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% block head_extra %}{% endblock %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {% block chrome %}{% endblock %}
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/pwa.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
